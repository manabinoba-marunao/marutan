<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#0F5257">
<title>マルワード(試作)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#18242B; --muted:#5B6A70; --line:#D9E0DE;
  --accent:#0F5257; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --ng:#B63E32; --ng-soft:#F7E0DC; --gold:#E0A526; --tile:#F7E7C1; --tile-ink:#3B2A10;
  --en:"Literata", Georgia, serif; --ja:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#0F1719;--surface:#172225;--ink:#E6EEEC;--muted:#9AABAF;--line:#2B3B3E;--accent:#5FB3AE;--accent-ink:#0B1517;--accent-soft:#1F3A3C;--ok:#6CC990;--ok-soft:#1C3A28;--ng:#EE8A7E;--ng-soft:#43231F;--tile:#4A3B1E;--tile-ink:#FBEBC8}}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja);line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:900}
.note{color:var(--muted);font-size:13px;margin:0}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4;cursor:default}
input[type=text]{font:inherit;font-size:20px;letter-spacing:.2em;text-align:center;width:7em;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.hud b{font-size:26px;font-variant-numeric:tabular-nums}
.hud .code{font-size:12px;opacity:.85}
.word{min-height:70px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border-radius:14px;border:2px dashed var(--line)}
.word.flash-ok{border-color:var(--ok);background:var(--ok-soft)}
.word.flash-ng{border-color:var(--ng);background:var(--ng-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rack{display:flex;justify-content:center;gap:5px;flex-wrap:nowrap}
.tile{position:relative;width:clamp(36px,11vw,58px);height:clamp(46px,13vw,64px);border-radius:10px;border:none;background:var(--tile);color:var(--tile-ink);font-family:var(--en);font-size:clamp(24px,7vw,32px);font-weight:700;text-transform:uppercase;box-shadow:0 4px 0 #C9A35A;padding:0}
.tile small{position:absolute;right:5px;bottom:2px;font-size:11px;font-family:var(--ja)}
.tile:disabled{opacity:.18;box-shadow:none}
.tile.in{box-shadow:0 2px 0 #C9A35A}
.ctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ctrl .go{font-size:18px;padding:10px 26px}
.msg{text-align:center;min-height:1.6em;font-weight:700;margin:0}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)}
.found{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--en);padding:2px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.chip.miss{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
.chip.all{background:var(--gold);color:#3B2A10}
.big{font-size:60px;font-weight:900;color:var(--accent);line-height:1.1;text-align:center}
.big small{font-size:.35em}
.rules li{margin:2px 0}
</style>
</head>
<body>
<main id="app"></main>

/* ============================================================
   マルワード(試作):7枚の文字カードで、英単語をできるだけたくさん作るゲーム
   ・使える単語は「マル単に入っている単語」。作れたら点数(文字の点+長さボーナス)
   ・同じ「コード」を入れると、みんな同じ7文字で勝負できる(クラス対抗・GPの下準備)
   ============================================================ */
const DICT = new Set(DICT_WORDS);
const PTS = {a:1,e:1,i:1,o:1,u:1,l:1,n:1,r:1,s:1,t:1,d:2,g:2,b:3,c:3,m:3,p:3,f:4,h:4,v:4,w:4,y:4,k:5,j:8,x:8,q:10,z:10};
const LEN_BONUS = {5:3, 6:6, 7:15};
const TIMES = [[60,"1分"],[120,"2分"],[180,"3分"]];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canMake = (w, rack) => { const c = {}; for(const ch of rack) c[ch] = (c[ch]||0)+1; for(const ch of w){ if(!c[ch]) return false; c[ch]--; } return true; };
/* 7文字の単語を元にして、作れる単語が多い組み合わせだけを出題に使う */
const RACKS = DICT_WORDS.filter(w=>w.length===7).filter(r=>DICT_WORDS.filter(w=>canMake(w,r)).length>=10).sort();
function rng(seed){ let x = seed>>>0 || 1; return () => { x ^= x<<13; x>>>=0; x ^= x>>17; x ^= x<<5; x>>>=0; return x/4294967296; }; }
const score = w => [...w].reduce((t,c)=>t+(PTS[c]||1),0) + (LEN_BONUS[w.length]||0);

const st = {view:"home", sec:120, code:"", joinCode:""};
let G = null;

function newGame(code){
  const c = String(code || Math.floor(1000 + Math.random()*9000));
  const r = rng(Number(c)*2654435761 % 4294967296);
  const base = RACKS[Math.floor(r()*RACKS.length)];
  const letters = [...base]; for(let i=letters.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [letters[i],letters[j]] = [letters[j],letters[i]]; }
  G = {code:c, letters, pick:[], found:[], score:0, msg:"", mcls:"", start:Date.now(), end:Date.now()+st.sec*1000, all:DICT_WORDS.filter(w=>canMake(w,base)).sort((a,b)=>b.length-a.length||a.localeCompare(b))};
  st.view = "play"; clearInterval(G.t); G.t = setInterval(tick, 250); render();
}
function tick(){
  if(!G) return; const left = G.end - Date.now();
  const el = $("#left"); if(el) el.textContent = fmt(left);
  if(left<=0){ clearInterval(G.t); st.view = "result"; render(); }
}
const fmt = ms => { const t = Math.max(0, Math.ceil(ms/1000)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };
function put(i){ if(!G || G.pick.includes(i)) return; G.pick.push(i); G.msg = ""; render(); }
function back(){ if(G && G.pick.length){ G.pick.pop(); render(); } }
function clearW(){ if(G){ G.pick = []; render(); } }
function shuf(){ if(!G) return; const keep = G.pick.map(i=>G.letters[i]); const order = G.letters.map((c,i)=>i).sort(()=>Math.random()-.5); G.letters = order.map(i=>G.letters[i]); G.pick = []; const used = new Set(); keep.forEach(ch=>{ const k = G.letters.findIndex((c,i)=>c===ch && !used.has(i)); if(k>=0){ used.add(k); G.pick.push(k); } }); render(); }
function submit(){
  if(!G || !G.pick.length) return;
  const w = G.pick.map(i=>G.letters[i]).join("");
  let ok = false;
  if(w.length<2){ G.msg = "2文字以上の単語を作ろう"; }
  else if(G.found.includes(w)){ G.msg = `「${w}」はもう見つけたよ`; }
  else if(!DICT.has(w)){ G.msg = `「${w}」はマル単にない単語みたい`; }
  else { ok = true; const p = score(w); G.found.unshift(w); G.score += p; G.msg = w.length===7 ? `🎉 ぜんぶ使った！ ${w} +${p}点` : `⭕ ${w} +${p}点`; }
  G.mcls = ok ? "ok" : "ng"; G.pick = ok ? [] : G.pick; G.flash = ok ? "flash-ok" : "flash-ng";
  render(); setTimeout(()=>{ if(G){ G.flash = ""; const el = $(".word"); el && el.classList.remove("flash-ok","flash-ng"); } }, 450);
}

function render(){
  const app = $("#app");
  app.innerHTML = st.view==="play" ? viewPlay() : st.view==="result" ? viewResult() : viewHome();
}
function viewHome(){
  return `<h1>🔠 マルワード <small class="note">試作</small></h1>
  <p class="note">7枚の文字カードを使って、英単語をできるだけたくさん作ろう！ 使える単語は<b>マル単に入っている単語</b>。</p>
  <section class="panel">
    <p class="label">時間</p>
    <div class="seg">${TIMES.map(([v,l])=>`<button aria-pressed="${st.sec===v}" data-act="sec" data-v="${v}">${l}</button>`).join("")}</div>
    <button class="primary" data-act="new" style="font-size:18px;padding:12px">ひとりで遊ぶ(ランダムな文字)</button>
  </section>
  <section class="panel">
    <p class="label">みんなで同じ文字で勝負(4けたのコード)</p>
    <p class="note" style="margin:0">先生がコードを決めて、みんなで同じコードを入れると、全員同じ7文字になるよ。</p>
    <div class="seg" style="align-items:center"><input type="text" id="code" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(st.joinCode)}"><button class="primary" data-act="join">このコードではじめる</button></div>
  </section>
  <section class="panel">
    <p class="label">点数のルール</p>
    <ul class="rules note" style="margin:0;padding-left:1.2em">
      <li>カードの右下の数字がその文字の点(よく使う文字は1点、q・z は10点)</li>
      <li>5文字 +3点、6文字 +6点、<b>7文字ぜんぶ使うと +15点</b></li>
      <li>同じ単語は1回だけ。2文字以上から</li>
    </ul>
  </section>`;
}
function viewPlay(){
  const w = G.pick.map(i=>G.letters[i]);
  return `<div class="hud"><span>⏱ <span id="left">${fmt(G.end-Date.now())}</span></span><span class="code">コード ${esc(G.code)}</span><span><b>${G.score}</b> 点</span></div>
  <div class="word ${G.flash||""}">${w.length ? w.map((c,k)=>`<button class="tile in" data-act="back1" data-k="${k}">${esc(c)}<small>${PTS[c]}</small></button>`).join("") : `<span class="note">下のカードをタップして単語を作ろう</span>`}</div>
  <p class="msg ${G.mcls||""}">${esc(G.msg||"")}</p>
  <div class="rack">${G.letters.map((c,i)=>`<button class="tile" data-act="put" data-i="${i}" ${G.pick.includes(i)?"disabled":""}>${esc(c)}<small>${PTS[c]}</small></button>`).join("")}</div>
  <div class="ctrl"><button data-act="back">⌫ 1つもどす</button><button data-act="shuf">🔀 まぜる</button><button data-act="clear">クリア</button></div>
  <div class="ctrl"><button class="primary go" data-act="submit">けってい！</button></div>
  <section class="panel"><p class="label">見つけた単語(${G.found.length}こ)</p>
    <div class="found">${G.found.map(f=>`<span class="chip ${f.length===7?"all":""}">${esc(f)}</span>`).join("") || `<span class="note">まだないよ</span>`}</div></section>
  <p class="note" style="text-align:center">パソコンはキーボードでも打てます(Enter で決定・Backspace でもどす)　<button class="link" data-act="quit" style="border:none;background:none;color:var(--accent);text-decoration:underline;padding:0">やめる</button></p>`;
}
function viewResult(){
  const miss = G.all.filter(w=>!G.found.includes(w));
  return `<section class="panel" style="text-align:center">
    <p class="label">マルワード　コード ${esc(G.code)}・${st.sec/60}分</p>
    <div class="big">${G.score}<small>点</small></div>
    <p style="margin:0">見つけた単語 <b>${G.found.length}</b> こ / 作れた単語 ${G.all.length} こ</p>
    <div class="seg" style="justify-content:center"><button class="primary" data-act="again">同じ文字でもう一度</button><button data-act="new">新しい文字で</button><button data-act="home">はじめの画面</button></div>
  </section>
  <section class="panel"><p class="label">見つけた単語</p><div class="found">${G.found.map(f=>`<span class="chip ${f.length===7?"all":""}">${esc(f)} <small>+${score(f)}</small></span>`).join("") || `<span class="note">なし</span>`}</div></section>
  <section class="panel"><p class="label">ほかにも作れた単語(マル単で覚えよう！)</p><div class="found">${miss.map(f=>`<span class="chip miss ${f.length===7?"all":""}">${esc(f)}</span>`).join("") || `<span class="note">ぜんぶ見つけた！すごい！</span>`}</div></section>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  const ci = $("#code"); if(ci) st.joinCode = ci.value.replace(/\D/g,"");
  if(a==="sec"){ st.sec = +b.dataset.v; render(); }
  else if(a==="new"){ newGame(); }
  else if(a==="join"){ if(!/^\d{4}$/.test(st.joinCode)){ alertMsg(); return; } newGame(st.joinCode); }
  else if(a==="again"){ newGame(G.code); }
  else if(a==="home" || a==="quit"){ if(G) clearInterval(G.t); G = null; st.view = "home"; render(); }
  else if(a==="put"){ put(+b.dataset.i); }
  else if(a==="back1"){ G.pick.splice(+b.dataset.k); render(); }
  else if(a==="back"){ back(); }
  else if(a==="clear"){ clearW(); }
  else if(a==="shuf"){ shuf(); }
  else if(a==="submit"){ submit(); }
});
function alertMsg(){ const ci = $("#code"); if(ci){ ci.focus(); ci.style.borderColor = "var(--ng)"; } }
document.addEventListener("keydown", e => {
  if(st.view!=="play" || !G || e.target.tagName==="INPUT") return;
  if(e.key==="Enter"){ e.preventDefault(); submit(); }
  else if(e.key==="Backspace"){ e.preventDefault(); back(); }
  else if(/^[a-z]$/i.test(e.key)){ const i = G.letters.findIndex((c,k)=>c===e.key.toLowerCase() && !G.pick.includes(k)); if(i>=0) put(i); }
});
const q = new URLSearchParams(location.search).get("code");
if(q && /^\d{4}$/.test(q)) st.joinCode = q;
render();
</script>
</body>
